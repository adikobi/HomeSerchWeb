<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>מלון ממן</title>
  <meta name="description" content="מלאי הבית וספר המתכונים של המשפחה.">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" id="theme-color-meta" content="#0e1311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מלון ממן">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body data-view="boot">
  <a class="skip-link" href="#main">דלג לתוכן</a>

  <div id="splash"><img src="logo.svg" alt="מלון ממן"></div>

  <!-- Sign in -->
  <section id="auth" aria-labelledby="auth-title">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="logo.svg" alt="" class="auth-logo">
        <h2 id="auth-title">מלון ממן</h2>
        <p class="muted">מלאי הבית וספר המתכונים, במקום אחד.</p>
      </div>
      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">אימייל</label>
          <input type="email" id="email" dir="ltr" placeholder="name@example.com" autocomplete="email" inputmode="email" enterkeyhint="next">
        </div>
        <div class="field">
          <label for="password">סיסמה</label>
          <div class="input-row pass-row">
            <input type="password" id="password" dir="ltr" placeholder="••••••••" autocomplete="current-password" enterkeyhint="go">
            <button type="button" class="icon-btn" id="pass-toggle" aria-label="הצגת סיסמה" data-icon="eye"></button>
          </div>
        </div>
        <p class="auth-error" id="auth-error" role="alert" hidden></p>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block"><span class="lbl">כניסה</span></button>
        <p class="auth-alt">אין לכם חשבון? <button type="button" id="register-btn" class="text-btn"><span class="lbl">יצירת חשבון</span></button></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app">
    <header class="topbar shell">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="">
        <h1 class="brand-name">מלון ממן</h1>
      </div>
      <div class="top-actions">
        <button id="theme-btn" class="icon-btn" type="button" aria-label="החלפת ערכת צבעים">
          <span class="sun-icon" data-icon="sun"></span><span class="moon-icon" data-icon="moon"></span>
        </button>
        <div class="menu-wrap">
          <button id="menu-btn" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="עוד אפשרויות" data-icon="more"></button>
          <div id="menu" class="menu" role="menu" aria-label="עוד אפשרויות">
            <div class="menu-user" id="menu-user"></div>
            <button type="button" role="menuitem" data-act="export-xlsx"><span data-icon="sheet" data-size="18"></span>ייצוא ל־Excel</button>
            <button type="button" role="menuitem" data-act="import-xlsx"><span data-icon="upload" data-size="18"></span>ייבוא מ־Excel</button>
            <button type="button" role="menuitem" data-act="export-word"><span data-icon="doc" data-size="18"></span>ייצוא מתכונים ל־Word</button>
            <hr>
            <button type="button" role="menuitem" data-act="logout" class="is-danger"><span data-icon="logout" data-size="18"></span>התנתקות</button>
          </div>
        </div>
      </div>
    </header>

    <div id="sentinel" aria-hidden="true"></div>
    <div class="toolbar">
      <div class="shell">
        <div class="search" role="search">
          <span class="search-ico" data-icon="search" data-size="20"></span>
          <label for="search" class="sr-only">חיפוש</label>
          <input id="search" type="text" role="searchbox" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="חיפוש">
          <button id="search-clear" class="icon-btn sm" type="button" aria-label="ניקוי חיפוש" hidden data-icon="x" data-size="18"></button>
          <button id="search-scan" class="icon-btn scan" type="button" aria-label="סריקת ברקוד" data-icon="scan" data-size="22"></button>
        </div>
      </div>
    </div>

    <main id="main" class="shell" tabindex="-1">
      <div class="meta-row">
        <span id="count" aria-live="polite"></span>
        <button id="sort-btn" class="chip-btn" type="button" aria-label="שינוי סדר מיון"></button>
      </div>
      <div id="views">
        <div id="list-inv" class="list"></div>
        <div id="panel-recipes" hidden><div id="list-rec" class="list list-cards"></div></div>
      </div>
    </main>

    <button id="fab" class="fab" type="button"><span data-icon="plus" data-size="22" data-sw="2.2"></span><span id="fab-label">הוספה</span></button>

    <nav class="dock" aria-label="ניווט ראשי">
      <div class="dock-inner" id="dock" data-tab="books" style="--i:0">
        <span class="dock-indicator" aria-hidden="true"></span>
        <button class="tab" type="button" data-tab="books"><span data-icon="book" data-size="22"></span><span>ספרים</span></button>
        <button class="tab" type="button" data-tab="food"><span data-icon="food" data-size="22"></span><span>מזון</span></button>
        <button class="tab" type="button" data-tab="items"><span data-icon="box" data-size="22"></span><span>פריטים</span></button>
        <button class="tab" type="button" data-tab="recipes"><span data-icon="chef" data-size="22"></span><span>מתכונים</span></button>
      </div>
    </nav>
  </div>

  <div id="layers"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
