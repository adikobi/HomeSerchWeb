<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>מלון ממן — מלאי וספר מתכונים</title>
    <meta name="description" content="ניהול מלאי של ספרים, מזון ופריטים, וספר מתכונים משפחתי.">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" id="theme-color-meta" content="#0e0d0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="מלון ממן">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">דלג לתוכן</a>

    <div id="splash-screen">
        <img src="logo.svg" alt="מלון ממן" class="splash-logo">
    </div>

    <div id="auth-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <div class="modal-content auth-modal-content">
            <div class="auth-brand">
                <img src="logo.svg" alt="" class="auth-logo">
                <h2 id="auth-title">מלון ממן</h2>
                <p class="auth-subtitle">מלאי וספר מתכונים במקום אחד</p>
            </div>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">אימייל</label>
                    <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div class="auth-actions">
                    <button type="submit" id="login-btn" class="btn auth-btn auth-btn-primary">התחבר</button>
                    <button type="button" id="register-btn" class="btn auth-btn auth-btn-secondary">צור חשבון</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container hidden" id="main-container">
        <header class="app-header">
            <div class="header-left">
                <button id="logout-btn" class="logout-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span>התנתק</span>
                </button>
                <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="החלף ערכת צבעים">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
            <div class="header-center">
                <img src="logo.svg" alt="" class="header-logo">
                <h1 class="app-title">מלון ממן</h1>
            </div>
            <div class="header-right">
                <div class="dropdown header-dropdown">
                    <button id="more-btn" class="more-btn" type="button" aria-label="עוד אפשרויות" aria-haspopup="true"><span></span><span></span><span></span></button>
                    <div id="dropdown-content" class="dropdown-content">
                        <button id="items-btn" class="dropdown-item category-btn" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                            <span>פריטים</span>
                        </button>
                        <button id="export-btn" class="dropdown-item" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span>ייצוא לאקסל</span>
                        </button>
                        <button id="import-btn" class="dropdown-item" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            <span>ייבוא מאקסל</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content" id="main">
            <nav class="category-selection" aria-label="קטגוריות">
                <div class="category-buttons">
                    <button id="books-btn" class="category-btn" type="button">ספרים</button>
                    <button id="food-btn" class="category-btn" type="button">מזון</button>
                    <button id="recipes-btn" class="category-btn" type="button">ספר מתכונים</button>
                </div>
            </nav>

            <div class="search-add-section">
                <div class="search-container">
                    <label for="search-input" class="sr-only">חיפוש פריטים</label>
                    <input type="text" id="search-input" placeholder="חיפוש לפי שם, מיקום, הערה או סופר">
                    <button id="search-btn" class="btn search-btn" type="button">חפש</button>
                </div>
                <div class="addScan-container">
                    <button id="add-item-btn" class="btn action-btn" type="button">הוסף פריט</button>
                    <button id="scan-barcode-btn" class="btn action-btn" type="button">סרוק ברקוד</button>
                </div>
            </div>

            <section class="items-list" aria-label="רשימת פריטים">
                <div id="items-container"></div>
            </section>
        </main>

        <div id="scanner-container" class="hidden">
            <div id="interactive" class="viewport"></div>
            <button id="stop-scan-btn" class="btn" type="button">הפסק סריקה</button>
        </div>

        <div id="item-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-content">
                <button type="button" class="close-btn" aria-label="סגור">&times;</button>
                <h2 id="modal-title">הוסף פריט חדש</h2>
                <form id="item-form">
                    <div class="form-group">
                        <label for="item-category">קטגוריה</label>
                        <select id="item-category" required>
                            <option value="books">ספרים</option>
                            <option value="food">מזון</option>
                            <option value="items">פריטים</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-description">שם הפריט</label>
                        <input type="text" id="item-description" required>
                    </div>
                    <div class="form-group" id="author-group">
                        <label for="item-author">סופר</label>
                        <input type="text" id="item-author">
                    </div>
                    <div class="form-group">
                        <label for="item-location">מיקום</label>
                        <input type="text" id="item-location" required>
                    </div>
                    <div class="form-group">
                        <label for="item-notes">הערות</label>
                        <textarea id="item-notes"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="item-barcode">ברקוד</label>
                        <input type="text" id="item-barcode" inputmode="numeric">
                    </div>
                    <button type="submit" id="save-item-btn" class="btn">שמור</button>
                </form>
            </div>
        </div>

        <div id="export-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="export-title">
            <div class="modal-content">
                <button type="button" class="close-export-modal-btn" aria-label="סגור">&times;</button>
                <h2 id="export-title">ייצוא נתונים</h2>
                <form id="export-form">
                    <div class="form-group">
                        <label for="export-category">קטגוריה לייצוא</label>
                        <select id="export-category" required>
                            <option value="books">ספרים</option>
                            <option value="food">מזון</option>
                            <option value="items">פריטים</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">ייצא ל-Excel</button>
                </form>
            </div>
        </div>

        <div id="import-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="import-title">
            <div class="modal-content">
                <button type="button" class="close-import-modal-btn" aria-label="סגור">&times;</button>
                <h2 id="import-title">ייבוא נתונים מאקסל</h2>
                <div class="import-instructions">
                    <p><strong>הקובץ צריך להיות בפורמט .xlsx או .xls עם העמודות:</strong></p>
                    <ul>
                        <li><strong>description</strong> — שם הפריט (חובה)</li>
                        <li><strong>location</strong> — מיקום</li>
                        <li><strong>notes</strong> — הערות</li>
                        <li><strong>barcode</strong> — ברקוד</li>
                        <li><strong>author</strong> — סופר (לספרים בלבד)</li>
                    </ul>
                </div>
                <form id="import-form">
                    <div class="form-group">
                        <label for="import-file">קובץ</label>
                        <input type="file" id="import-file" accept=".xlsx, .xls" required>
                    </div>
                    <div class="form-group">
                        <label for="import-category">קטגוריה לייבוא</label>
                        <select id="import-category" required>
                            <option value="books">ספרים</option>
                            <option value="food">מזון</option>
                            <option value="items">פריטים</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">התחל ייבוא</button>
                </form>
                <div id="import-results" class="import-results" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
